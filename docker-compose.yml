services:
  neo4j:
    image: neo4j:5.26-community
    container_name: alphaswarm-neo4j
    ports:
      # Loopback only. Bolt and the Neo4j browser are guarded by a single
      # superuser account, so publishing them on 0.0.0.0 hands anyone who can
      # reach this machine full read/write/DDL over the graph.
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      # No password lives in this repository. Compose aborts `up` when
      # ALPHASWARM_NEO4J__PASSWORD is unset OR empty (the `:?` form checks
      # both). Same variable the application reads, so one value configures
      # both sides. See .env.example.
      NEO4J_AUTH: "neo4j/${ALPHASWARM_NEO4J__PASSWORD:?set ALPHASWARM_NEO4J__PASSWORD to a per-install secret, e.g. openssl rand -hex 32 (see .env.example)}"
    volumes:
      - neo4j_data:/data
    healthcheck:
      # Derives the password in-container from NEO4J_AUTH (strip through the
      # first "/") so the credential is never written here. `$$` escapes
      # Compose interpolation; the shell inside the container does the rest.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  # Throwaway database for `pytest -m neo4j` (docs/DECISIONS.md#adr-tests-scoped-cleanup).
  # Only the `test` profile starts it: scripts/neo4j_test.sh up. It listens on
  # 7688 so no test can reach the dev database on 7687, and its data lives in
  # tmpfs, so every container start is empty.
  neo4j-test:
    image: neo4j:5.26-community
    container_name: alphaswarm-neo4j-test
    profiles: ["test"]
    ports:
      - "127.0.0.1:7688:7687"          # loopback only; never 7687
    environment:
      # Throwaway credential for an empty tmpfs database that only the test
      # profile starts. Not a secret: it guards nothing but an empty tmpfs database.
      NEO4J_AUTH: "neo4j/alphaswarm-test-only"
      NEO4J_server_memory_heap_max__size: "512m"
      NEO4J_server_memory_pagecache_size: "256m"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p alphaswarm-test-only 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  neo4j_data:
