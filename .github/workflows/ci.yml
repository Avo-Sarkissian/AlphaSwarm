name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check src tests

      - name: ruff format
        run: uv run ruff format --check src tests

      - name: mypy (strict; modules in [[tool.mypy.overrides]] exempt)
        run: uv run mypy src

      - name: import-linter
        run: uv run lint-imports

      - name: vulture (dead code)
        run: uv run vulture src vulture_whitelist.py --min-confidence 80

  backend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # pyproject.toml requires-python = ">=3.11"
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Neo4j-marked tests run in backend-neo4j; live_network tests run in nightly.yml;
      # ollama tests need a local Ollama server and stay out of CI.
      - name: Offline tests with coverage gate
        shell: bash
        run: >-
          uv run pytest -q -rxX -m "not neo4j and not live_network and not ollama"
          --cov=alphaswarm --cov-branch --cov-report=term-missing:skip-covered
          --cov-fail-under=85 | tee pytest-unit.txt

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Backend (offline)"
            echo
            uv run coverage report --format=markdown || echo "no coverage data"
            echo
            echo "### xfail / xpass"
            echo '```'
            grep -E '^(XFAIL|XPASS)' pytest-unit.txt || echo "none"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  backend-neo4j:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/alphaswarm-test-only
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        ports:
          - 7688:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p alphaswarm-test-only 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # --require-neo4j turns an unreachable database into a failure, not a skip.
      - name: Read models, report templates and write paths against neo4j-test
        shell: bash
        run: >-
          uv run pytest -q -rxX -m neo4j --require-neo4j
          --cov=alphaswarm --cov-branch --cov-report= | tee pytest-neo4j.txt

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Backend (neo4j-test)"
            echo
            uv run coverage report --format=markdown \
              --include='src/alphaswarm/graph/*.py,src/alphaswarm/report.py' || echo "no coverage data"
            echo
            echo "### xfail / xpass"
            echo '```'
            grep -E '^(XFAIL|XPASS)' pytest-neo4j.txt || echo "none"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (ESLint)
        run: npm run lint

      - name: Dead code (knip)
        run: npm run knip

      - name: Unit tests
        run: npx vitest run

      - name: Type check and build
        run: npm run build
