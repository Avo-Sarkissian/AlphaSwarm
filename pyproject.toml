[project]
name = "alphaswarm"
version = "0.6.0"
description = "Local-first multi-agent financial simulation engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Avo Sarkissian" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "structlog>=25.5.0",
    "psutil>=7.2.2",
    "ollama>=0.6.1",
    "backoff>=2.2.1",
    "neo4j>=5.28,<6.0",
    "jinja2>=3.1.6",
    "aiofiles>=25.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "yfinance>=1.2.2,<2.0",
    "feedparser>=6.0.12,<7.0",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "ruff",
    "mypy",
    "import-linter==2.11",
    "pytest-socket==0.7.0",
    "hypothesis==6.152.1",
    "pytest-timeout>=2.4.0",
    "types-psutil>=7.2.2.20260906",
    "types-aiofiles>=25.1.0.20260518",
    "vulture==2.16",
    "pre-commit>=4.7.0",
]

[project.urls]
Homepage = "https://github.com/Avo-Sarkissian/AlphaSwarm"
Repository = "https://github.com/Avo-Sarkissian/AlphaSwarm"
Issues = "https://github.com/Avo-Sarkissian/AlphaSwarm/issues"
Changelog = "https://github.com/Avo-Sarkissian/AlphaSwarm/blob/master/docs/HISTORY.md"

[project.scripts]
alphaswarm = "alphaswarm.cli:main"
start = "alphaswarm.cli:main_web"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
# UP042 (str + Enum -> StrEnum) changes str() of every enum member; that conversion is a
# deliberate behaviour change made on its own, not a lint autofix.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Verbatim LLM-output fixtures: wrapping them would change the strings under test.
"tests/test_parsing.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket --ignore-glob='* [2-9].py' --strict-markers --strict-config"
markers = [
    "enable_socket: opt-in socket access (docs/DECISIONS.md#adr-test-network-gate); prefer the markers below",
    "neo4j: needs the throwaway neo4j-test database on 127.0.0.1:7688 (scripts/neo4j_test.sh up)",
    "live_network: reaches the public internet (Yahoo, Google News, cloud APIs); skipped unless --run-live",
    "ollama: needs a running local Ollama server; skipped unless --run-live",
    "slow: takes longer than about one second; informational",
]
timeout = 60
# pytest 9.0 ignores --strict-* flags that arrive through addopts, so these ini keys are what
# enforce strict markers and config; the addopts flags only document the intent.
strict_markers = true
strict_config = true
xfail_strict = true
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["alphaswarm"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

# No module is exempt from strict mode; never add an ignore_errors override
# (tests/invariants/test_mypy_overrides.py).
# yfinance ships no py.typed marker; its imports are typed as Any.
[[tool.mypy.overrides]]
module = ["yfinance"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "alphaswarm"

[[tool.importlinter.contracts]]
name = "Holdings isolation — only advisory, services.advisory and web.routes.holdings may import alphaswarm.holdings"
type = "forbidden"
source_modules = [
    "alphaswarm.app",
    "alphaswarm.batch_dispatcher",
    "alphaswarm.cli",
    "alphaswarm.context_formatter",
    "alphaswarm.data_audit",
    "alphaswarm.episodes",
    "alphaswarm.errors",
    "alphaswarm.evaluation",
    "alphaswarm.fsutil",
    "alphaswarm.governor",
    "alphaswarm.graph",
    "alphaswarm.graph.analytics",
    "alphaswarm.graph.manager",
    "alphaswarm.graph.replay_interview",
    "alphaswarm.graph.rows",
    "alphaswarm.graph.schema_writes",
    "alphaswarm.inference",
    "alphaswarm.inference.anthropic_provider",
    "alphaswarm.inference.budget",
    "alphaswarm.inference.call_log",
    "alphaswarm.inference.concurrency",
    "alphaswarm.inference.factory",
    "alphaswarm.inference.ollama_provider",
    "alphaswarm.inference.openai_provider",
    "alphaswarm.inference.provider",
    "alphaswarm.inference.rate_limit",
    "alphaswarm.inference.schema",
    "alphaswarm.inference.structured",
    "alphaswarm.inference.types",
    "alphaswarm.influence",
    "alphaswarm.ingestion",
    "alphaswarm.ingestion.fixture",
    "alphaswarm.ingestion.providers",
    "alphaswarm.ingestion.types",
    "alphaswarm.ingestion.yfinance_provider",
    "alphaswarm.ingestion.rss_provider",
    "alphaswarm.interview",
    "alphaswarm.logging",
    "alphaswarm.manifest",
    "alphaswarm.memory_monitor",
    "alphaswarm.metrics",
    "alphaswarm.ollama_client",
    "alphaswarm.ollama_models",
    "alphaswarm.parsing",
    "alphaswarm.readiness",
    "alphaswarm.report",
    "alphaswarm.security",
    "alphaswarm.security.hashing",
    "alphaswarm.services",
    "alphaswarm.services.advisory",
    "alphaswarm.services.jobs",
    "alphaswarm.services.post_run",
    "alphaswarm.services.report",
    "alphaswarm.services.runtime",
    "alphaswarm.seed",
    "alphaswarm.simulation",
    "alphaswarm.state",
    "alphaswarm.types",
    "alphaswarm.worker",
    "alphaswarm.web",
    "alphaswarm.web.app",
    "alphaswarm.web.broadcaster",
    "alphaswarm.web.wire",
    "alphaswarm.web.connection_manager",
    "alphaswarm.web.deps",
    "alphaswarm.web.errors",
    "alphaswarm.web.guards",
    "alphaswarm.web.origin_guard",
    "alphaswarm.web.params",
    "alphaswarm.web.replay_manager",
    "alphaswarm.web.simulation_manager",
    "alphaswarm.web.routes",
    "alphaswarm.web.routes.agents",
    "alphaswarm.web.routes.edges",
    "alphaswarm.web.routes.health",
    "alphaswarm.web.routes.interview",
    "alphaswarm.web.routes.replay",
    "alphaswarm.web.routes.report",
    "alphaswarm.web.routes.advisory",
    "alphaswarm.web.routes.simulation",
    "alphaswarm.web.routes.websocket",
    "alphaswarm.web.routes.settings",
    "alphaswarm.settings",
    "alphaswarm.inference.config",
    "alphaswarm.personas",
    "alphaswarm.prompts",
    "alphaswarm.prompts.decision",
    "alphaswarm.prompts.modifiers",
    "alphaswarm.security.sanitize",
    "alphaswarm.peers",
    "alphaswarm.rounds",
]
forbidden_modules = ["alphaswarm.holdings"]
# D-04 whitelist: alphaswarm.web.routes.holdings is the ONE permitted importer.
# alphaswarm.web.routes is listed in source_modules above (covers its submodules),
# but this route is intentionally exempted via ignore_imports so it can import
# alphaswarm.holdings and alphaswarm.holdings.loader at module scope.
ignore_imports = [
    "alphaswarm.web.routes.holdings -> alphaswarm.holdings",
    "alphaswarm.web.routes.holdings -> alphaswarm.holdings.loader",
    # The advisory route is in source_modules (so the FastAPI layer keeps its
    # forbidden-import coverage) and imports the whitelisted alphaswarm.advisory
    # package for AdvisoryReport; it reaches holdings only through AdvisoryService
    # (docs/DECISIONS.md#adr-holdings-isolation).
    "alphaswarm.web.routes.advisory -> alphaswarm.advisory",
    # The advisory service is the third sanctioned holdings consumer. It may import
    # the advisory package and the holdings TYPES only, never the loader
    # (docs/DECISIONS.md#adr-holdings-isolation).
    "alphaswarm.services.advisory -> alphaswarm.advisory",
    "alphaswarm.services.advisory -> alphaswarm.holdings.types",
]

[[tool.importlinter.contracts]]
name = "Acyclic siblings — no import cycles between alphaswarm modules or subpackages"
type = "acyclic_siblings"
ancestors = ["alphaswarm"]

[[tool.importlinter.contracts]]
name = "Engine is provider-agnostic — simulation, rounds and peers never reach Ollama objects"
type = "forbidden"
source_modules = ["alphaswarm.simulation", "alphaswarm.rounds", "alphaswarm.peers"]
forbidden_modules = [
    "alphaswarm.inference.ollama_provider",
    "alphaswarm.ollama_client",
    "alphaswarm.ollama_models",
]

[[tool.importlinter.contracts]]
name = "Layers: web > services > report, interview and engine > graph (the graph never imports upward)"
type = "layers"
layers = [
    "alphaswarm.web",
    "alphaswarm.services",
    "alphaswarm.report : alphaswarm.interview : alphaswarm.simulation : alphaswarm.rounds : alphaswarm.peers",
    "alphaswarm.graph",
]
