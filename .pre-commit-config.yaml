repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (autofix)
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        files: ^(src|tests)/
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        files: ^(src|tests)/
      - id: lint-imports
        name: import-linter (holdings isolation contract, docs/DECISIONS.md#adr-holdings-isolation)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true
